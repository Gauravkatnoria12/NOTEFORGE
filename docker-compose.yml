version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: noteforge-db
    ports:
      - "27017:27017"
    volumes:
      - noteforge-db-data:/data/db
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: noteforge-app
    ports:
      - "8000:8000"
    environment:
      # Use the container name 'mongodb' as the host address
      - MONGODB_URI=mongodb://mongodb:27017/noteforge
      - SMTP_EMAIL=your-gmail-address@gmail.com
      - SMTP_APP_PASSWORD=your-gmail-app-password
      - JWT_SECRET=change_me_to_something_secure_and_random_32_chars
      - GEMINI_API_KEY=your_gemini_api_key_here
      - FRONTEND_URL=http://localhost:5173
      - COOKIE_SECURE=False
      - COOKIE_SAMESITE=lax
    depends_on:
      - mongodb
    restart: unless-stopped

volumes:
  noteforge-db-data:
